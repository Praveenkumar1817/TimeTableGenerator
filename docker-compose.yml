version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: timetable_db
    ports:
      - "5433:5432"
    volumes:
      - timetable_postgres_data:/var/lib/postgresql/data

volumes:
  timetable_postgres_data:
